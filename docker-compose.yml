services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localakademi-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # JWT_SECRET is REQUIRED — set in .env or shell environment
      - JWT_SECRET=${JWT_SECRET}
      # Çalışma zamanı bağlantısı: EN AZ YETKİLİ rol — yalnız SELECT/INSERT/
      # UPDATE/DELETE. DDL, TRUNCATE ve superuser yok. Rolü oluşturmak için:
      #   APP_DB_PASSWORD="..." npx tsx scripts/setup-app-db-role.ts
      - DATABASE_URL=postgresql://localakademi_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD tanimlanmali}@postgres:5432/localakademi?schema=public
      # Göç adımı DDL gerektirir, bu yüzden sahip rolüyle çalışır.
      # Yalnız docker-entrypoint.sh içindeki migrate deploy kullanır.
      - MIGRATE_DATABASE_URL=postgresql://localakademi:${DB_PASSWORD:?DB_PASSWORD tanimlanmali}@postgres:5432/localakademi?schema=public
      # CORS_ORIGIN is REQUIRED for production — set to your frontend URL
      - CORS_ORIGIN=${CORS_ORIGIN}
      # AI sağlayıcı — ÜRÜN KARARI: yalnız OmniRoute / yerel Ollama.
      # Buradaki varsayılan eskiden `nvidia` idi; AI_PROVIDER ortamda
      # tanımlanmazsa mentor trafiği sessizce ABD'ye gidiyordu. Artık
      # varsayılan YOK — açıkça verilmeli.
      - AI_PROVIDER=${AI_PROVIDER}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY}
      - OMNIROUTE_MODEL=${OMNIROUTE_MODEL:-auto/best-free}
      # Yurt dışı sağlayıcılar bilinçli olarak açılmadıkça reddedilir.
      - AI_ALLOW_EXTERNAL_PROVIDERS=${AI_ALLOW_EXTERNAL_PROVIDERS:-false}
      # Ters vekil arkasındaysanız ayarlayın (ör. 1). Tanımsızsa
      # X-Forwarded-For yok sayılır — hız sınırları soket adresine göre işler.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # E-posta — şifre sıfırlama ve e-posta doğrulama buna bağlı.
      # Üretimde eksikse sunucu açılışta durur (bkz. mailer.ts).
      - RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY tanimlanmali}
      - MAIL_FROM=${MAIL_FROM:?MAIL_FROM tanimlanmali}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:?APP_PUBLIC_URL tanimlanmali}
    volumes:
      - server-data:/app/prisma
      - server-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - localakademi-network

  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: localakademi-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      - POSTGRES_USER=localakademi
      # Varsayılan YOK: "localakademi" zayıf parolası üretime sızmasın.
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD tanimlanmali}
      - POSTGRES_DB=localakademi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localakademi -d localakademi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - localakademi-network

  # Redis for caching (future)
  redis:
    image: redis:7-alpine
    container_name: localakademi-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - localakademi-network
    profiles:
      - with-redis

volumes:
  server-data:
  server-uploads:
  postgres-data:
  redis-data:

networks:
  localakademi-network:
    driver: bridge
