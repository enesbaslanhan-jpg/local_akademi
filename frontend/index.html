<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Safari ve iOS SVG favicon desteklemiyor; PNG karsiliklari sart.
         Uretimi: public/favicon.svg -> @resvg/resvg-js. Logo degisirse
         PNG ler yeniden uretilmeli (bkz. favicon.svg icindeki not). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#14384A" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const saved = localStorage.getItem('localkarar-theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>LocalKarar — İşletmen için doğru kararlar</title>
    <!--
      ARAMA VE PAYLAŞIM ETİKETLERİ (14.09.2026). Açıklama yokken Google
      sonuçta başlığın altını rastgele bir menü metniyle dolduruyordu;
      WhatsApp/LinkedIn paylaşımı görselsiz çıkıyordu. Sayfaya özel başlık
      ve açıklamayı hooks/useSayfaMeta.js değiştirir; bunlar varsayılan.
    -->
    <meta name="description" content="Küçük işletmeler için kayıt, cari hesap, pazaryeri siparişi, kâr hesaplama ve AI Mentor tek uygulamada. 30 gün ücretsiz." />
    <link rel="canonical" href="https://localkarar.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LocalKarar" />
    <meta property="og:title" content="LocalKarar — İşletmen için doğru kararlar" />
    <meta property="og:description" content="Kayıt, cari hesap, pazaryeri siparişi, kâr hesaplama ve AI Mentor tek uygulamada. 30 gün ücretsiz." />
    <meta property="og:url" content="https://localkarar.com/" />
    <meta property="og:image" content="https://localkarar.com/paylasim-1200x630.png" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Localkarar" />
    <!--
      Fontlar KENDİ SUNUCUMUZDAN servis ediliyor (@fontsource/manrope,
      src/main.jsx içinde import edilir).

      Önceden Google Fonts CDN'den yükleniyordu; bu, giriş ve hukuki sayfalar
      dahil HER ziyaretçinin IP adresini ve User-Agent bilgisini Google'a
      (ABD) gönderiyordu — hiçbir hukuki metinde açıklanmadan. Çerez
      kullanılmadığı için "üçüncü taraf çerezi yok" ifadesi teknik olarak
      doğruydu, ama IP aktarımı yine de bir veri aktarımıdır.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
