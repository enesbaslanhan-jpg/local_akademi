<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Karlılık Oranı karar haritası</title>
  <desc id="desc">Kârlılık oranı, seçilen kâr tanımını onu üreten satış, varlık veya özkaynak tabanına bölerek farklı ölçekleri karşılaştırılabilir hale getiren göreli göstergedir. Bu kursun sınırı “Net Kâr” ile “Nakit Büyüme Oranı” başlıkları arasında özellikle korunur: Karlılık Oranı, kendi karar anı ve çıktısıyla ele alınır. Dört aşama: gösterge, kanıt, karar eşiği ve çalışma çıktısı.</desc>
