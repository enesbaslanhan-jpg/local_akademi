    <text x="1030" y="335" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Karlılık Oranı odaklı pay–payda…</text>
  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#334155">hangi paydanın yönetim sorusuna uygun olduğunu ve orandaki değişimin fiyat, hacim, maliyet veya sermaye kullanımından doğduğunu seçmek; üretim planlama sorumlusu bu seçimi sezon başlamadan önce yaparken net kâr ve nakit büyüme oranı kararlarını bunun yerine kullanmaz</text>
