<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Etkili Geri Bildirim karar haritası</title>
  <desc id="desc">Etkili Geri Bildirim, beklenen davranış, yetki, kanıt ve gelişim desteğini açık hale getiren insan ve güvenlik yönetimi konusudur. Bu kursun sınırı “Performans Görüşmesi” ile “Çalışan Öneri Sistemi” başlıkları arasında özellikle korunur: Etkili Geri Bildirim, kendi karar anı ve çıktısıyla ele alınır. Dört aşama: gösterge, kanıt, karar eşiği ve çalışma çıktısı.</desc>
