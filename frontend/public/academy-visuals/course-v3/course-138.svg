    <text x="1030" y="335" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#0f172a">Etkili Geri Bildirim odaklı Etk…</text>
  <text x="600" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" fill="#334155">hangi yetkinlik veya güvenlik açığının hangi destek ve kontrolle kapatılacağını seçmek; insan kaynakları sorumlusu bu seçimi bir haftalık kontrol döngüsünde yaparken performans görüşmesi ve çalışan öneri sistemi kararlarını bunun yerine kullanmaz</text>
