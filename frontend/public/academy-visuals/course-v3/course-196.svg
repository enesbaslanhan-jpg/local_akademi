<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Risk Kaydı karar haritası</title>
  <desc id="desc">AI Risk Kaydı, yapay zekâ kullanımını değer, veri, hata, insan kararı ve izleme sınırlarıyla yöneten sorumlu kullanım konusudur. Bu kursun sınırı “AI Hazırlık Değerlendirmesi” ile “İnsan Gözetimi Tasarımı” başlıkları arasında özellikle korunur: AI Risk Kaydı, kendi karar anı ve çıktısıyla ele alınır. Dört aşama: gösterge, kanıt, karar eşiği ve çalışma çıktısı.</desc>
