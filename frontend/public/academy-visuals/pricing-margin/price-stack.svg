<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">KDV hariç satış fiyatının katmanları</title>
  <desc id="desc">135 lira gerçek birim maliyet, 39 lira kanal komisyonu, 7 lira ödeme kesintisi ve 44 lira birim katkıdan oluşan 225 liralık örnek fiyat.</desc>
  <rect width="960" height="440" rx="24" fill="#f8fafc"/>
  <text x="56" y="62" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172554">Fiyat, maliyetin üzerine rastgele oran eklemek değildir</text>
  <text x="56" y="98" font-family="Arial,sans-serif" font-size="17" fill="#475569">Yüzdesel kesintiler satış fiyatı üzerinden hesaplanır.</text>
  <g transform="translate(56 148)">
    <rect width="540" height="92" rx="14" fill="#2563eb"/>
    <rect x="540" width="156" height="92" fill="#f59e0b"/>
    <rect x="696" width="28" height="92" fill="#ef4444"/>
    <rect x="724" width="176" height="92" rx="14" fill="#16a34a"/>
    <text x="270" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="white">Gerçek birim maliyet</text>
    <text x="270" y="68" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="white">135 TL</text>
    <text x="618" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#451a03">Komisyon</text>
    <text x="618" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#451a03">39 TL</text>
    <text x="710" y="-14" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#991b1b">7 TL ödeme</text>
    <text x="812" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="white">Birim katkı</text>
    <text x="812" y="67" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="white">44 TL</text>
  </g>
  <text x="56" y="296" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#172554">Örnek KDV hariç satış fiyatı: 225 TL</text>
  <text x="56" y="333" font-family="Arial,sans-serif" font-size="16" fill="#475569">Komisyon %17,5 ve ödeme kesintisi %3 ise bu tutarlar 225 TL üzerinden doğar.</text>
  <rect x="56" y="362" width="848" height="48" rx="10" fill="#e0f2fe"/>
  <text x="76" y="393" font-family="Arial,sans-serif" font-size="16" fill="#0c4a6e">Kural: Sabit tutarları paya, satış fiyatına bağlı oranları paydaya yerleştir.</text>
</svg>
