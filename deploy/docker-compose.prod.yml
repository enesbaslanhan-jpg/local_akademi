# Uretim eklentisi.
#
# Kullanim:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d
#
# PORT ELLE DUZENLENMEZ. docker-compose.yml zaten 127.0.0.1:3000:3000
# ile bagliyor; uygulama disariya acik degil.
#
# Onceden burada "su satiri sunucuda elle degistir" yaziyordu. Bu,
# izlenen bir dosyada yerel degisiklik birakiyordu ve o dosyaya dokunan
# ILK guncellemede `git pull` "local changes would be overwritten" ile
# durdu (22.08.2026).
#
# Cozum neden prod override'a port eklemek DEGIL: Compose'da `ports`
# listesi override dosyasinda EKLENIR, ust dosyadan kaldirilamaz. Yani
# buraya 127.0.0.1'li satiri yazmak, "3000:3000"i silmezdi -- ikisi
# birden gecerli olur ve port yine disariya acik kalirdi. Dogru cozum
# tabani bastan guvenli yapmakti.
#
# Disariya acilan tek sey Caddy'nin 80/443'u. Guvenlik duvari da ayrica
# 3000'i kapatiyor -- iki katman, biri unutulursa digeri tutar.

services:
  # Ozellik bayraklari.
  #
  # Kodda yedi FEATURE_* bayragi var ve hicbirinin varsayilani acik degil
  # (kod `=== 'true'` karsilastiriyor). Iletilmezlerse Karar Araclari,
  # ogrenme ilerlemesi, kisisellestirilmis akis ve baglamsal mentor
  # 404 FEATURE_DISABLED doner -- arayuzde "yuklenemedi" olarak gorunur.
  #
  # Bu blok eklenmeden once uretimde yedisi de KAPALIYDI: ne .env
  # orneginde vardilar ne de compose onlari kapsayiciya iletiyordu.
  #
  # Varsayilanlar gelistirme .env'indeki degerlerle ayni. .env'de
  # tanimlarsan oradaki kazanir.
  server:
    environment:
      - FEATURE_DECISION_CHECKS_ENABLED=${FEATURE_DECISION_CHECKS_ENABLED:-true}
      - FEATURE_LEARNING_PROGRESS_ENABLED=${FEATURE_LEARNING_PROGRESS_ENABLED:-true}
      - FEATURE_PERSONALIZED_FEED_ENABLED=${FEATURE_PERSONALIZED_FEED_ENABLED:-true}
      - FEATURE_CONTEXTUAL_MENTOR_ENABLED=${FEATURE_CONTEXTUAL_MENTOR_ENABLED:-true}
      # Bu ucu gelistirmede de KAPALI -- eski surumler, yerlerine gecenler var.
      - FEATURE_LEGACY_QUIZ_ENABLED=${FEATURE_LEGACY_QUIZ_ENABLED:-false}
      - FEATURE_LEGACY_FLASHCARDS_ENABLED=${FEATURE_LEGACY_FLASHCARDS_ENABLED:-false}
      - FEATURE_PRACTICAL_CARDS_ENABLED=${FEATURE_PRACTICAL_CARDS_ENABLED:-false}

  caddy:
    image: caddy:2-alpine
    container_name: localakademi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - server
    networks:
      - localakademi-network

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
