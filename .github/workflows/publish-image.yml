name: Publish Production Image

on:
  workflow_call:
    inputs:
      verified_sha:
        description: Exact commit SHA that passed Release Gate
        required: true
        type: string

concurrency:
  group: publish-production-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the exact verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verified_sha }}

      - name: Prepare image coordinates
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          sha="${{ inputs.verified_sha }}"
          echo "name=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=ghcr.io/${repository}:${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable and latest tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Calisan surumun kimligi imaja gomuluyor; /health bunu
          # yayimliyor ve dagitim betigi dogruluyor.
          build-args: |
            RELEASE_COMMIT=${{ inputs.verified_sha }}
          tags: |
            ${{ steps.image.outputs.sha_tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.revision=${{ inputs.verified_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish deployment coordinates
        run: echo "Deploy image ${{ steps.image.outputs.sha_tag }}"
