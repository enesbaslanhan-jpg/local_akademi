name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: Full 40-character commit SHA produced by Publish Production Image
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Validate immutable image tag
        shell: bash
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: design/localkarar-18

      - name: Configure verified SSH host
        shell: bash
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/production_key"
          chmod 600 "$HOME/.ssh/production_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Back up, deploy, verify, and roll back on failure
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          port="${SSH_PORT:-22}"
          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ || ! "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ || ! "$port" =~ ^[0-9]{1,5}$ ]]; then
            echo "Production SSH coordinates are invalid" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "PRODUCTION_DEPLOY_PATH contains unsupported characters" >&2
            exit 1
          fi
          repository="${GITHUB_REPOSITORY,,}"
          image="ghcr.io/${repository}:${IMAGE_SHA}"
          ssh_opts=(-i "$HOME/.ssh/production_key" -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote_script="/tmp/localkarar-deploy-${IMAGE_SHA}.sh"

          # 🔴 BETIK ARTIK STDIN'DEN BESLENMIYOR.
          #
          # Onceki hali `bash -s ... < deploy/deploy-production.sh` idi:
          # bash betigi STDIN'den satir satir okuyor, betigin ICINDEKI
          # `docker compose exec` de STDIN'den okuyor. Yedek komutu
          # betigin GERI KALANINI yutunca bash "dosya bitti" deyip
          # 0 ile cikti. Olculdu (08.09.2026, ilk uretim dagitimi):
          # yedek alindi, imaj hic cekilmedi, servis yeniden
          # baslatilmadi, saglik/surum dogrulamasi hic calismadi --
          # ve GitHub "Success" gosterdi. Site eski surumde kaldi.
          #
          # Betik once dosyaya yaziliyor, sonra STDIN kapali calisiyor.
          ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            "cat > '$remote_script'" < deploy/deploy-production.sh

          set +e
          deploy_output="$(ssh -n "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
            "bash '$remote_script' '$DEPLOY_PATH' '$image'; rc=\$?; rm -f '$remote_script'; exit \$rc" 2>&1)"
          deploy_rc=$?
          set -e
          printf '%s\n' "$deploy_output"
          if [[ $deploy_rc -ne 0 ]]; then
            exit "$deploy_rc"
          fi

          # ⚠️ CIKIS KODU TEK BASINA YETMIYOR — yukaridaki ariza tam da
          # 0 ile cikmisti. Betik yalniz TUM adimlari bitirdiginde bu
          # satiri yaziyor; yoksa dagitim yarim kalmis demektir.
          if ! grep -q "DEPLOY_COMPLETE ${IMAGE_SHA}" <<< "$deploy_output"; then
            echo "Deployment did not run to completion for ${IMAGE_SHA}" >&2
            exit 1
          fi
