name: Release Gate

on:
  push:
    branches: [main, master, beta, develop]
  pull_request:
    branches: [main, master, beta]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  JWT_SECRET: ci-secret-that-is-at-least-32-bytes-long-for-testing
  JWT_EXPIRES_IN: 1h
  AI_PROVIDER: nvidia
  NVIDIA_API_URL: http://127.0.0.1:9999/v1/chat/completions
  NVIDIA_API_KEY: ci-mock-key
  NVIDIA_MODEL: ci-mock-model
  AI_REVIEW_GATE_ENABLED: 'false'
  AI_REQUEST_TIMEOUT_MS: '10000'
  BETA_MODE: 'true'
  ENABLE_MEMORY_API: 'false'
  DATABASE_URL: postgresql://localakademi:localakademi@localhost:5432/localakademi_ci?schema=public
  DB_PASSWORD: localakademi

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: localakademi
          POSTGRES_PASSWORD: localakademi
          POSTGRES_DB: localakademi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U localakademi -d localakademi_ci
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate (CI)
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx tsx prisma/seed.ts

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Secret scan
        run: npm run secret:scan

      # 22.08.2026 denetiminde src/ altinda ham SQL kullanimi SIFIRDI.
      # Bu adim onu boyle tutuyor: tek bir $queryRawUnsafe cagrisi
      # guvenceyi sessizce bitirir ve kod incelemesinde gozden kacar --
      # cunku calisir, testler gecer, hicbir sey uyarmaz.
      - name: Raw SQL scan
        run: npm run sql:scan

      # Gizli anahtar taramasi vardi, BAGIMLILIK taramasi yoktu. 22.08.2026
      # olcumunde uretim bagimliliklarinda iki YUKSEK acik birikmisti
      # (brace-expansion DoS, fast-uri host confusion) ve hicbir sey uyarmadi.
      #
      # --omit=dev: gelistirme araclarinin acigi uretimde calismiyor; yayin
      # kapisini onlarla kirmak gurultu yapar ve adim gorulmez hale gelir.
      # --audit-level=high: orta seviyeler raporlanir ama kapiyi kapatmaz.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Migration validation
        run: npm run validate:migrations

      - name: Full release gate
        run: npm run verify:release
        env:
          SKIP_NPM_INSTALL: 'true'

      # Adi "Frontend smoke test" idi ama betik BACKEND uc noktalarini
      # deniyor (/health, /auth/register, /business/business-profile,
      # /dashboard). Yanlis ad, frontend'in CI'da hic kapsanmadigini
      # gizliyordu.
      #
      # `|| true` de kaldirildi: betik process.exit(EXIT_CODE) ile
      # duzgun cikiyor, ama `|| true` her basarisizligi yutuyordu --
      # yani bu adim ASLA yapiyi kiramiyordu.
      - name: API smoke test
        run: |
          npx tsx src/server.ts &
          SERVER_PID=$!
          sleep 5
          node scripts/frontend-smoke.js
          SMOKE_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $SMOKE_EXIT
        env:
          PORT: '3000'

      - name: Release report
        run: npm run release:report

      - name: Upload release report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-report
          path: release-report.json

      - name: Upload release gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-report
          path: release-gate-report.json

  # Frontend CI'da HIC KAPSANMIYORDU: ne birim testleri ne derleme
  # calisiyordu. Kirik bir arayuz release gate'ten temiz gecerdi.
  #
  # Ayri is: veritabani gerektirmiyor, backend ile paralel kosuyor ve
  # bir hata oldugunda hangi tarafta oldugu adindan belli oluyor.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run --configLoader runner

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: frontend
        run: npm run build
