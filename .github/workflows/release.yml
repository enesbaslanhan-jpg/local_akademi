name: Release Gate

on:
  push:
    branches: [design/localkarar-18]
  pull_request:
    branches: [design/localkarar-18]
  workflow_dispatch:

# LocalKarar'in kanonik dali design/localkarar-18. Diger dallar korunur,
# ancak uretim kapisi yalniz bu dala gelen degisiklikleri kabul eder.
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  JWT_SECRET: ci-secret-that-is-at-least-32-bytes-long-for-testing
  JWT_EXPIRES_IN: 1h
  AI_PROVIDER: nvidia
  NVIDIA_API_URL: http://127.0.0.1:9999/v1/chat/completions
  NVIDIA_API_KEY: ci-mock-key
  NVIDIA_MODEL: ci-mock-model
  AI_REVIEW_GATE_ENABLED: 'false'
  AI_REQUEST_TIMEOUT_MS: '10000'
  BETA_MODE: 'true'
  ENABLE_MEMORY_API: 'false'
  # Test guvenlik kilidi yalniz `_test` son ekli veritabanlarini kabul eder.
  # Vitest de bu adresi kullanir; uretim veritabanina test semasi uygulanamaz.
  DATABASE_URL: postgresql://localakademi:localakademi@localhost:5432/localakademi_test?schema=public
  TEST_DATABASE_URL: postgresql://localakademi:localakademi@localhost:5432/localakademi_test?schema=public
  DB_PASSWORD: localakademi

jobs:
  release-gate:
    runs-on: ubuntu-latest
    # Tam test paketi ve cok asamali Docker imaji ayni kapida dogrulanir.
    # GitHub runner hizindaki dalgalanmalarda dogru yapinin yarida kesilmemesi
    # icin ust sinir; takilan alt komutlarin kendi daha kisa timeout'lari var.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # GitHub'in service-container hazirligi hata ayrintisini saklayarak
      # checkout'tan once cikiyordu. Veritabanini acik bir adimda baslatmak
      # hem ayni izolasyonu korur hem de gercek Docker logunu gorunur yapar.
      - name: Start PostgreSQL with pgvector
        run: |
          docker run --detach \
            --name localkarar-ci-postgres \
            --publish 5432:5432 \
            --env POSTGRES_USER=localakademi \
            --env POSTGRES_PASSWORD=localakademi \
            --env POSTGRES_DB=localakademi_test \
            pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb

          for attempt in {1..30}; do
            if docker exec localkarar-ci-postgres \
              pg_isready -U localakademi -d localakademi_test; then
              exit 0
            fi
            sleep 2
          done

          docker logs localkarar-ci-postgres
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma migrate (CI)
        run: npx prisma migrate deploy

      - name: Seed database
        run: npx tsx prisma/seed.ts

      # production-readiness testi, sunucu tarafindan servis edilecek gercek
      # hash'li frontend ciktisini da dogrular. Temiz checkout'ta dist yoktur.
      - name: Install frontend dependencies for integrity check
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build frontend for integrity check
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

      - name: Secret scan
        run: npm run secret:scan

      # 22.08.2026 denetiminde src/ altinda ham SQL kullanimi SIFIRDI.
      # Bu adim onu boyle tutuyor: tek bir $queryRawUnsafe cagrisi
      # guvenceyi sessizce bitirir ve kod incelemesinde gozden kacar --
      # cunku calisir, testler gecer, hicbir sey uyarmaz.
      - name: Raw SQL scan
        run: npm run sql:scan

      # Gizli anahtar taramasi vardi, BAGIMLILIK taramasi yoktu. 22.08.2026
      # olcumunde uretim bagimliliklarinda iki YUKSEK acik birikmisti
      # (brace-expansion DoS, fast-uri host confusion) ve hicbir sey uyarmadi.
      #
      # --omit=dev: gelistirme araclarinin acigi uretimde calismiyor; yayin
      # kapisini onlarla kirmak gurultu yapar ve adim gorulmez hale gelir.
      # --audit-level=high: orta seviyeler raporlanir ama kapiyi kapatmaz.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Migration validation
        run: npm run validate:migrations

      - name: Full release gate
        run: npm run verify:release
        env:
          SKIP_NPM_INSTALL: 'true'
          SKIP_UNIT_TESTS: 'true'

      # Adi "Frontend smoke test" idi ama betik BACKEND uc noktalarini
      # deniyor (/health, /auth/register, /business/business-profile,
      # /dashboard). Yanlis ad, frontend'in CI'da hic kapsanmadigini
      # gizliyordu.
      #
      # `|| true` de kaldirildi: betik process.exit(EXIT_CODE) ile
      # duzgun cikiyor, ama `|| true` her basarisizligi yutuyordu --
      # yani bu adim ASLA yapiyi kiramiyordu.
      - name: API smoke test
        run: |
          npx tsx src/server.ts &
          SERVER_PID=$!
          sleep 5
          node scripts/frontend-smoke.js
          SMOKE_EXIT=$?
          kill $SERVER_PID 2>/dev/null || true
          exit $SMOKE_EXIT
        env:
          PORT: '3000'

      - name: Release report
        run: npm run release:report
        env:
          SKIP_UNIT_TESTS: 'true'

      - name: Upload release report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-report
          path: release-report.json

      - name: Upload release gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-gate-report
          path: release-gate-report.json

      - name: Stop PostgreSQL
        if: always()
        run: docker rm --force localkarar-ci-postgres || true

  # Frontend CI'da HIC KAPSANMIYORDU: ne birim testleri ne derleme
  # calisiyordu. Kirik bir arayuz release gate'ten temiz gecerdi.
  #
  # Ayri is: veritabani gerektirmiyor, backend ile paralel kosuyor ve
  # bir hata oldugunda hangi tarafta oldugu adindan belli oluyor.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run --configLoader runner

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        working-directory: frontend
        run: npm run build
