  <style>

    *{box-sizing:border-box}html,body{margin:0;background:#ddd8d0;color:var(--ink);font-family:Manrope,"Segoe UI",system-ui,sans-serif}
    body{min-width:320px}.hidden{display:none!important}.mono{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}
    button,input,select{font:inherit}button{border:0}.btn:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}.no-wrap{white-space:nowrap}.material{box-shadow:var(--shadow);border:1px solid rgba(255,253,249,.68)}

    /* board */
    .board{width:1800px;min-height:1420px;margin:40px auto;padding:46px;background:var(--canvas);position:relative;overflow:hidden}

    .board-kicker{font-size:12px;font-weight:700;color:var(--petrol);letter-spacing:.06em}.board h1{margin:9px 0 12px;font-size:50px;line-height:1.04;letter-spacing:-.035em}.board-lead{max-width:780px;font-size:17px;line-height:1.58;color:var(--secondary)}

    .buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{height:40px;padding:0 18px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;white-space:nowrap}.btn.primary{background:var(--petrol);color:#fff}.btn.secondary{background:var(--raised);color:var(--ink);border:1px solid var(--line-strong)}.btn.quiet{background:var(--sunken);color:var(--secondary)}.btn.ghost{background:transparent;color:var(--deep)}

    .finance-block{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{padding:12px 0;border-top:1px solid rgba(255,255,255,.16)}.metric strong{font-size:28px;display:block}.metric span{font-size:11px;color:rgba(255,255,255,.65)}.trend{height:54px;display:flex;align-items:flex-end;gap:5px}.trend i{width:8px;background:var(--soft);border-radius:3px 3px 0 0;opacity:.72}

    .news-block{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}.news-image{min-height:150px;border-radius:10px;background:linear-gradient(135deg,#CDB698,#8AA8A8);position:relative}.news-image:after{content:"Yerel ekonomide yeni dönem";position:absolute;left:14px;right:14px;bottom:14px;color:#fff;font-size:17px;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.25)}.news-list div{padding:9px 0;border-bottom:1px solid var(--line);font-size:12px;font-weight:650}
    .mentor{display:grid;gap:10px}.message{max-width:88%;padding:11px 13px;border-radius:12px;background:var(--sunken);font-size:12px;line-height:1.5}.message.user{margin-left:auto;background:rgba(31,102,115,.12)}.composer{height:42px;border-radius:11px;background:var(--raised);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:space-between;padding:0 7px 0 13px;font-size:12px;color:var(--muted)}.send{width:30px;height:30px;border-radius:8px;background:var(--petrol);color:#fff;display:grid;place-items:center}
    .motion-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.motion-tile{height:86px;border-radius:10px;background:var(--sunken);display:grid;place-items:center;text-align:center;font-size:11px;color:var(--secondary);position:relative}.motion-tile i{display:block;width:28px;height:28px;border-radius:8px;background:var(--petrol);margin:0 auto 5px}.motion-tile:nth-child(2) i{transform:scale(.98)}.motion-tile:nth-child(3) i{border-radius:14px 14px 14px 3px}.motion-tile:nth-child(4) i{background:var(--soft)}
    .wide{grid-column:span 2}.full{grid-column:1/-1}.state-row{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.state{padding:12px;border-radius:9px;background:var(--sunken);font-size:11px}.state strong{display:block;margin-bottom:6px}.state.selected{background:rgba(31,102,115,.12);outline:1px solid rgba(31,102,115,.28)}.state.disabled{color:#89908E;border:1px dashed rgba(24,62,69,.16)}.state.error{background:rgba(168,72,63,.08);color:#813B35}.state.loading{background:linear-gradient(90deg,var(--sunken),#F8F5F0,var(--sunken));background-size:220% 100%}

    .sidebar{background:#E6E2DC;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;font-weight:850;color:var(--deep);letter-spacing:-.02em}.brandmark{width:30px;height:30px;border-radius:9px;background:var(--deep);color:#fff;display:grid;place-items:center}.navgroup{margin:8px 0 5px;padding:0 10px;font-size:10px;font-weight:750;color:var(--muted)}.navitem{height:40px;border-radius:8px;padding:0 10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--secondary);margin:2px 0}.navitem b{width:17px;color:var(--muted)}.navitem.active{background:rgba(31,102,115,.11);color:var(--deep);font-weight:750}.navitem.active b{color:var(--petrol)}.navitem.recommended em{font-style:normal;margin-left:auto;color:var(--warm);font-size:10px}.sidefoot{margin-top:auto;padding:12px 9px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
    .app{min-width:0;display:grid;grid-template-rows:52px 1fr}.topbar{display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(242,239,234,.86)}.route{font-size:12px;font-weight:740;color:var(--secondary)}.topsearch{margin-left:auto;width:230px;height:34px;border-radius:999px;background:var(--sunken);display:flex;align-items:center;padding:0 13px;font-size:11px;color:var(--muted)}.topicon{width:34px;height:34px;border-radius:9px;background:var(--surface);display:grid;place-items:center;color:var(--secondary);font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,var(--sand),var(--warm));border:2px solid var(--raised)}

    .metric-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0}.metric-item{padding:4px 18px;border-left:1px solid var(--line)}.metric-item:first-child{border-left:0;padding-left:0}.metric-item small{display:block;color:var(--muted);font-size:10px}.metric-item strong{display:block;font-size:23px;margin:4px 0}.metric-item span{font-size:10px;color:var(--secondary)}
    .toolrow{display:grid;grid-template-columns:36px 1.3fr .7fr .7fr auto;gap:12px;align-items:center;min-height:58px;border-bottom:1px solid var(--line)}.toolrow:last-child{border:0}.toolrow p{margin:3px 0 0;font-size:11px;color:var(--muted)}
    .filters{height:42px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}.chip{height:28px;padding:0 11px;border-radius:999px;background:var(--sunken);display:flex;align-items:center;font-size:10px;font-weight:720}.chip.active{background:rgba(31,102,115,.13);color:var(--deep)}
    .chart{height:160px;display:flex;align-items:flex-end;gap:9px;padding:28px 2px 22px;border-bottom:1px solid var(--line);position:relative}.chart:before{content:"hedef";position:absolute;top:48px;left:0;right:0;border-top:1px dashed rgba(201,130,69,.55);padding-top:3px;color:#7A4720;font-size:10px}.chart:after{content:attr(data-caption);position:absolute;left:0;bottom:4px;color:var(--muted);font-size:10px}.chart i{flex:1;background:var(--petrol);border-radius:4px 4px 0 0;opacity:.70}.timeline{display:grid;gap:0}.timeitem{display:grid;grid-template-columns:24px 1fr;gap:10px;min-height:60px}.timeitem i{width:10px;height:10px;border:2px solid var(--petrol);border-radius:50%;margin-top:4px;position:relative}.timeitem:not(:last-child) i:after{content:"";position:absolute;width:1px;height:46px;background:var(--line-strong);left:3px;top:9px}.timeitem p{margin:3px 0;font-size:11px;color:var(--muted)}
    .course-tile{display:grid;grid-template-columns:116px 1fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.cover{border-radius:11px;background:linear-gradient(145deg,#D9C5A8,#EEE2D0);min-height:80px;position:relative}.cover:before{content:"LK";position:absolute;left:12px;bottom:10px;color:var(--deep);font-weight:850;font-size:24px}.course-tile h3{margin:4px 0 7px;font-size:14px}.meta{font-size:11px;color:#5E6A6A}
    .lesson-stage{background:#1B2425;border-radius:16px;color:#fff;height:470px;padding:25px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow-deep)}.lesson-stage h2{font-size:27px;max-width:650px;line-height:1.25}.stage-body{max-width:700px;font-size:15px;line-height:1.75;color:#D6DDDA}.lesson-example{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;max-width:720px}.lesson-example div{padding:12px;border:1px solid rgba(255,255,255,.13);border-radius:9px;background:rgba(255,255,255,.05)}.lesson-example small{display:block;color:#9FBFC2;font-size:10px}.lesson-example strong{font-size:15px}.lessonrail{background:var(--surface);border-radius:12px;padding:15px}.lesson{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12px}.lesson.active{color:var(--deep);font-weight:750}.stepper{display:flex;gap:7px}.stepper i{height:5px;flex:1;border-radius:6px;background:var(--sunken)}.stepper i.done{background:var(--petrol)}

    .receipt-large{width:760px;margin:0 auto;background:#FFF9EE;padding:28px 34px;border-radius:5px 5px 16px 16px;box-shadow:0 24px 50px rgba(87,62,30,.14);color:var(--deep)}.receipt-large h2{font-size:27px;margin:5px 0 7px}.receipt-section{padding:15px 0;border-top:1px dashed rgba(24,62,69,.22)}

    .chatstream{display:flex;flex-direction:column;gap:13px;padding:12px}.bubble{max-width:72%;padding:14px 16px;border-radius:13px;background:var(--surface);font-size:13px;line-height:1.55}.bubble.user{margin-left:auto;background:rgba(31,102,115,.12)}.sourcecap{margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:10px;color:var(--petrol);font-weight:720}
    .editorial-lead{min-height:300px;border-radius:16px;background:linear-gradient(135deg,#36585A,#B98D60);padding:28px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-deep)}.editorial-lead h2{font-size:30px;max-width:650px;margin:7px 0}.story{display:grid;grid-template-columns:82px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.thumb{border-radius:9px;background:linear-gradient(145deg,var(--sand),#78979A)}.story h3{font-size:13px;margin:1px 0 5px}
    .formrow{display:grid;grid-template-columns:230px 1fr;gap:24px;padding:18px 0;border-bottom:1px solid var(--line)}.formrow label{font-size:13px;font-weight:730}.formrow p{font-size:11px;color:var(--muted);margin:4px 0}.input{height:40px;border-radius:8px;background:var(--sunken);padding:0 12px;display:flex;align-items:center;font-size:12px}
    .health{display:grid;grid-template-columns:1.3fr repeat(3,.7fr);gap:18px;align-items:center}.health strong{font-size:20px}.exception{display:grid;grid-template-columns:90px 1fr 120px auto;gap:12px;min-height:48px;align-items:center;border-bottom:1px solid var(--line);font-size:12px}

    /* family sheet */
    .family{width:1660px;margin:30px auto;padding:36px;background:#DAD5CD}.family-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.family-head h1{font-size:34px;margin:0;color:var(--deep)}.family-head p{margin:7px 0 0;color:#576361}.family-meta{font-size:12px;color:#59625F}.family-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.mini-frame{background:#EFECE7;border-radius:13px;padding:8px 8px 12px;box-shadow:0 12px 26px rgba(59,58,52,.12)}.mini-label{display:flex;justify-content:space-between;padding:8px 5px 2px;font-size:11px;font-weight:760;color:var(--deep)}.mini-viewport{width:492px;height:308px;overflow:hidden;border-radius:8px;background:var(--canvas);position:relative}.mini-viewport .screen{transform:scale(.342);transform-origin:top left}

  </style>
</head>
